name: Make stable debug keystore (one time)

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Generate keystore
        run: |
          keytool -genkeypair -keystore wgauto-debug.keystore -alias wgauto \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass android -keypass android \
            -dname "CN=WG Auto Debug, OU=Dev, O=WG Auto, L=NA, ST=NA, C=US"
          keytool -list -keystore wgauto-debug.keystore -storepass android | head -5
      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: wgauto-debug-keystore
          path: wgauto-debug.keystore
          if-no-files-found: error
