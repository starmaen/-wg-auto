name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WGAuto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # رابط مباشر ثابت للتحميل (أنسب للهاتف والحظر الجغرافي من صفحة Artifacts)
      - name: Clear old rolling asset
        run: gh release delete-asset latest app-debug.apk --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "WG Auto — أحدث نسخة"
          body: "تُحدَّث تلقائياً مع كل بناء ناجح. حمّل WG-Auto.apk وثبّته."
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
